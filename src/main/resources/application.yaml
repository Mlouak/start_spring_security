spring:
  application:
    name: start_spring_security
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/example}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    user:
      name: user
      password: password
      roles: USER
    admin:
      name: admin
      password: password
      roles: ADMIN
