spring:
  application:
    name: start_spring_security
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_security}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
